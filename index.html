<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Verify Your Account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>

      margin: 0;

      background: #fffc00;

      text-align: center;
      border-radius: 12px;
      border: 1px solid #ddd;
      outline: none;
      margin-bottom: 20px;
    }

    input:focus {
      border-color: #fffc00;
      box-shadow: 0 0 0 2px rgba(255, 252, 0, 0.5);

    button {
